name: Auto-Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to KVM Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # Navigate to the backend directory on the server
            cd ~/noneya/backend
            
            # Pull the latest code from GitHub
            git pull origin main
            
            # Rebuild the new container image first
            docker build -t singularity-api .
            
            # Stop and remove the old container
            docker stop fastapi-app || true
            docker rm fastapi-app || true
            
            # Launch the new container
            docker run -d --name fastapi-app --restart unless-stopped -p 8000:8000 singularity-api
